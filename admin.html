<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BADGE — Admin Portal & Live DB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --card: #0d0d11; --red: #ff1744; --line: rgba(255,255,255,0.08); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body { background: var(--bg); color: #fff; min-height: 100vh; padding: 20px; }

.auth-box { max-width: 420px; margin: 80px auto; background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid var(--red); text-align: center; box-shadow: 0 0 50px rgba(255,23,68,0.15); }
.auth-box h2 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 8px; }
.auth-box p { color: #888; font-size: 11px; margin-bottom: 25px; line-height: 1.5; }
.warning-badge { background: rgba(255,23,68,0.1); color: var(--red); font-size: 9px; font-weight: 900; padding: 6px 12px; border-radius: 30px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(255,23,68,0.3); }

.dashboard { max-width: 1000px; margin: 30px auto; display: none; }
.admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
.grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 30px; }
.full { grid-column: span 2; }
input, select { width: 100%; padding: 12px 16px; background: #000; border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 12px; outline: none; margin-top: 6px; }
input:focus { border-color: var(--red); }
label { font-size: 10px; font-weight: 800; color: #777; text-transform: uppercase; letter-spacing: 1px; }

.btn-admin { background: var(--red); color: #fff; border: 0; padding: 14px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
.btn-admin:hover { opacity: 0.9; transform: translateY(-2px); }

.movie-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 10px; }
.movie-info { display: flex; align-items: center; gap: 15px; }
.movie-poster { width: 45px; height: 60px; border-radius: 6px; object-fit: cover; background:#222; }
.del-btn { background: #1a0508; color: var(--red); border: 1px solid rgba(255,23,68,0.3); padding: 8px 14px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
.del-btn:hover { background: var(--red); color: #fff; }

.section-title { font-family:'Space Grotesk', sans-serif; font-size:16px; color:#fff; margin-bottom:15px; margin-top:30px; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
.preview-qr { width: 100px; height: 100px; border-radius: 8px; border: 1px solid var(--red); margin-top: 10px; object-fit: contain; background: #fff; padding: 5px; }
</style>
</head>
<body>

<div class="auth-box" id="authBox">
    <div class="warning-badge">🔒 SECURE ADMIN AUTH</div>
    <h2>ADMIN LOGIN</h2>
    <p>Authentication required to access live DB writing.</p>
    
    <div style="text-align:left">
        <label>Admin Email</label>
        <input type="email" id="adminEmailInput" placeholder="admin@badge.com">
        <br><br>
        <label>Password</label>
        <input type="password" id="adminPassInput" placeholder="Enter Password">
    </div>
    
    <button class="btn-admin" id="loginBtn" style="width:100%; margin-top:20px;">Verify & Access</button>
</div>

<div class="dashboard" id="dashBoard">
    <div class="admin-head">
        <div>
            <h1 style="font-family:'Space Grotesk', sans-serif">BADGE DB CONTROL</h1>
            <p style="color:#666; font-size:11px">Authenticated Super-Admin Session Active</p>
        </div>
        <div>
            <a href="charity.html" target="_blank" style="color:#aaa; font-size:11px; margin-right:15px; text-decoration:none;">Charity Page ↗</a>
            <a href="movies.html" target="_blank" style="color:#aaa; font-size:11px; margin-right:15px; text-decoration:none;">View Page ↗</a>
            <button class="del-btn" id="lockBtn">🔒 Logout & Lock</button>
        </div>
    </div>

    <!-- CHARITY / UPI PAYMENT SETTINGS FORM -->
    <div class="section-title">💳 PAYMENT & CHARITY SETTINGS</div>
    <form class="grid-form" id="paymentForm">
        <div>
            <label>UPI ID (For Donations)</label>
            <input type="text" id="pUpi" placeholder="e.g. raj@upi" required>
        </div>
        <div>
            <label>QR Code Image Direct Link (URL)</label>
            <input type="url" id="pQrUrl" placeholder="https://example.com/my-qr.png" required>
        </div>
        <div class="full" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <label>Current Saved QR Preview</label><br>
                <img id="qrPreviewImg" class="preview-qr" src="" alt="No QR Set">
            </div>
            <button type="submit" class="btn-admin" style="height: fit-content; padding: 14px 25px;">Update Payment Config</button>
        </div>
    </form>

    <!-- MOVIE PUBLISH FORM -->
    <div class="section-title">🎬 PUBLISH NEW MOVIE</div>
    <form class="grid-form" id="movieForm">
        <div>
            <label>Movie Title</label>
            <input type="text" id="mName" placeholder="e.g. Kanguva" required>
        </div>
        <div>
            <label>Rating (e.g. 9.4)</label>
            <input type="text" id="mRating" placeholder="8.5" required>
        </div>
        <div class="full">
            <label>Poster / Banner Image URL</label>
            <input type="text" id="mBanner" placeholder="https://image-link.com/poster.jpg" required>
        </div>
        <div class="full">
            <label>Download Link (Leave empty if UPCOMING)</label>
            <input type="url" id="mLink" placeholder="https://download-server.com/file (Optional)">
        </div>
        <div>
            <label>Trending Status</label>
            <select id="mTrending">
                <option value="YES">🔥 TRENDING NOW</option>
                <option value="NO">NORMAL DROP</option>
            </select>
        </div>
        <div style="display:flex; align-items:flex-end;">
            <button type="submit" class="btn-admin" style="width:100%">Publish To Live Database</button>
        </div>
    </form>

    <div class="section-title">📚 LIVE DATABASE MOVIES</div>
    <div id="adminMovieList">Loading database...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBfGylU2R4GTtsgqJsbDl-Y2e8i-a2jbEE",
    authDomain: "badger-e5c9f.firebaseapp.com",
    databaseURL: "https://badger-e5c9f-default-rtdb.firebaseio.com",
    projectId: "badger-e5c9f",
    storageBucket: "badger-e5c9f.firebasestorage.app",
    messagingSenderId: "483650469817",
    appId: "1:483650469817:web:5818b00d1732b8baee8068",
    measurementId: "G-EXEE25B743"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Verification Login
  document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("adminEmailInput").value.trim();
      const pass = document.getElementById("adminPassInput").value.trim();
      
      if(!email || !pass) return alert("⚠️ Enter both email and password!");

      signInWithEmailAndPassword(auth, email, pass)
          .then(() => alert("✅ Verification Success! Access Granted."))
          .catch(err => alert("❌ Auth Failed: " + err.message));
  });

  // Logout
  document.getElementById("lockBtn").addEventListener("click", () => {
      signOut(auth).then(() => location.reload());
  });

  // Session Monitor
  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById("authBox").style.display = "none";
          document.getElementById("dashBoard").style.display = "block";
          listenToMovies();
          listenToPaymentDetails();
      } else {
          document.getElementById("authBox").style.display = "block";
          document.getElementById("dashBoard").style.display = "none";
      }
  });

  // Save UPI & QR Code Settings to Firebase Live DB
  document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const upiVal = document.getElementById("pUpi").value.trim();
      const qrVal = document.getElementById("pQrUrl").value.trim();

      set(ref(db, 'payment_details'), {
          upiId: upiVal,
          qrUrl: qrVal,
          updatedAt: Date.now()
      }).then(() => {
          alert("🚀 Payment details updated live!");
      }).catch((err) => {
          alert("❌ Error saving payment details: " + err.message);
      });
  });

  // Read Payment Details for Preview
  function listenToPaymentDetails() {
      onValue(ref(db, 'payment_details'), (snapshot) => {
          const data = snapshot.val();
          if(data) {
              document.getElementById("pUpi").value = data.upiId || "";
              document.getElementById("pQrUrl").value = data.qrUrl || "";
              document.getElementById("qrPreviewImg").src = data.qrUrl || "";
          }
      });
  }

  // Form Submit Handler for Movies
  document.getElementById("movieForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const moviesRef = ref(db, 'movies');
      const newMovieRef = push(moviesRef);
      
      set(newMovieRef, {
          name: document.getElementById("mName").value.trim(),
          rating: document.getElementById("mRating").value.trim(),
          banner: document.getElementById("mBanner").value.trim(),
          link: document.getElementById("mLink").value.trim(),
          trending: document.getElementById("mTrending").value,
          createdAt: Date.now()
      }).then(() => {
          document.getElementById("movieForm").reset();
          alert("🚀 Movie Published to Live Cloud Database!");
      }).catch((err) => {
          alert("❌ Permission Error: " + err.message);
      });
  });

  function listenToMovies() {
      const moviesRef = ref(db, 'movies');
      onValue(moviesRef, (snapshot) => {
          const data = snapshot.val();
          const list = document.getElementById("adminMovieList");
          list.innerHTML = "";

          if(!data) {
              list.innerHTML = "<p style='color:#444; font-size:11px;'>No movies in database.</p>";
              return;
          }

          Object.keys(data).reverse().forEach(key => {
              const m = data[key];
              const isUpcoming = !m.link || m.link.trim() === "";
              
              const item = document.createElement("div");
              item.className = "movie-item";
              item.innerHTML = `
                  <div class="movie-info">
                      <img src="${m.banner}" class="movie-poster" onerror="this.src='https://dummyimage.com/45x60/151518/888888.png&text=No+Img'">
                      <div>
                          <strong class="title-text" style="font-size:13px"></strong>
                          <div style="font-size:10px; color:#777; margin-top:3px;">
                              ⭐ ${m.rating} | ${isUpcoming ? '⏳ UPCOMING' : '⚡ READY'}
                          </div>
                      </div>
                  </div>
                  <button class="del-btn">Delete</button>
              `;
              
              item.querySelector(".title-text").textContent = m.name;
              item.querySelector(".del-btn").addEventListener("click", () => {
                  if(confirm("Are you sure you want to remove this movie globally?")) {
                      remove(ref(db, 'movies/' + key));
                  }
              });
              
              list.appendChild(item);
          });
      });
  }
</script>
</body>
</html>

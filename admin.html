<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BADGE — Private Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --card: #0d0d11; --red: #ff1744; --line: rgba(255,255,255,0.08); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body { background: var(--bg); color: #fff; min-height: 100vh; padding: 20px; }

.auth-box { max-width: 420px; margin: 80px auto; background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid var(--red); text-align: center; box-shadow: 0 0 50px rgba(255,23,68,0.15); }
.auth-box h2 { font-family: 'Space Grotesk'; font-size: 24px; margin-bottom: 8px; }
.auth-box p { color: #888; font-size: 11px; margin-bottom: 25px; line-height: 1.5; }
.warning-badge { background: rgba(255,23,68,0.1); color: var(--red); font-size: 9px; font-weight: 900; padding: 6px 12px; border-radius: 30px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(255,23,68,0.3); }

.dashboard { max-width: 1000px; margin: 30px auto; display: none; }
.admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
.grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 30px; }
.full { grid-column: span 2; }
input, select { width: 100%; padding: 12px 16px; background: #000; border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 12px; outline: none; margin-top: 6px; }
input:focus { border-color: var(--red); }
label { font-size: 10px; font-weight: 800; color: #777; text-transform: uppercase; letter-spacing: 1px; }

.btn-admin { background: var(--red); color: #fff; border: 0; padding: 14px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
.btn-admin:hover { opacity: 0.9; transform: translateY(-2px); }

.pass-change-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 30px; display: flex; gap: 15px; align-items: flex-end; }
.pass-change-card div { flex: 1; }

.movie-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 10px; }
.movie-info { display: flex; align-items: center; gap: 15px; }
.movie-poster { width: 45px; height: 60px; border-radius: 6px; object-fit: cover; background:#222; }
.del-btn { background: #1a0508; color: var(--red); border: 1px solid rgba(255,23,68,0.3); padding: 8px 14px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; }
.del-btn:hover { background: var(--red); color: #fff; }
</style>
</head>
<body>

<div class="auth-box" id="authBox">
    <div class="warning-badge">⚠️ HIGH SECURITY VERIFICATION</div>
    <h2>VERIFY IDENTITY</h2>
    <p>Enter Passcode to access admin dashboard.</p>
    
    <div style="text-align:left">
        <label>Passcode Verification</label>
        <input type="password" id="adminPassInput" placeholder="Enter Authorization Code" maxlength="30">
    </div>
    
    <button class="btn-admin" style="width:100%; margin-top:20px;" onclick="verifyAccess()">Access Panel</button>
</div>

<div class="dashboard" id="dashBoard">
    <div class="admin-head">
        <div>
            <h1 style="font-family:'Space Grotesk'">BADGE DB CONTROL</h1>
            <p style="color:#666; font-size:11px">Manage movies, ratings, and security credentials in real-time.</p>
        </div>
        <div>
            <a href="movies.html" target="_blank" style="color:#aaa; font-size:11px; margin-right:15px; text-decoration:none;">View Page ↗</a>
            <button class="del-btn" onclick="location.reload()">🔒 Lock Panel</button>
        </div>
    </div>

    <div class="pass-change-card">
        <div>
            <label>Update Master Passcode</label>
            <input type="password" id="newPassInput" placeholder="Enter New Passcode">
        </div>
        <button class="btn-admin" style="padding: 12px 20px;" onclick="changePassword()">Update Passcode</button>
    </div>

    <form class="grid-form" id="movieForm" onsubmit="addMovie(event)">
        <div>
            <label>Movie Title</label>
            <input type="text" id="mName" placeholder="e.g. Kanguva" required>
        </div>
        <div>
            <label>Rating (e.g. 9.4)</label>
            <input type="text" id="mRating" placeholder="8.5" required>
        </div>
        <div class="full">
            <label>Poster / Banner Image URL</label>
            <input type="url" id="mBanner" placeholder="https://image-link.com/poster.jpg" required>
        </div>
        <div class="full">
            <label>Download Link (Leave empty if UPCOMING)</label>
            <input type="url" id="mLink" placeholder="https://download-server.com/file (Optional)">
        </div>
        <div>
            <label>Trending Status</label>
            <select id="mTrending">
                <option value="YES">🔥 TRENDING NOW</option>
                <option value="NO">NORMAL DROP</option>
            </select>
        </div>
        <div style="display:flex; align-items:flex-end;">
            <button class="btn-admin" style="width:100%">Add Movie to Database</button>
        </div>
    </form>

    <h3 style="font-size:14px; margin-bottom:15px; color:#888;">CURRENT MOVIES IN DATABASE</h3>
    <div id="adminMovieList"></div>
</div>

<script>
// SHA-256 Hash of default password "1234"
const DEFAULT_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

async function hashString(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function getActiveHash() {
    return localStorage.getItem("BADGE_ADMIN_HASH") || DEFAULT_HASH;
}

async function verifyAccess() {
    const input = document.getElementById("adminPassInput").value.trim();
    const inputHash = await hashString(input);
    const activeHash = getActiveHash();
    
    if(inputHash === activeHash) {
        document.getElementById("authBox").style.display = "none";
        document.getElementById("dashBoard").style.display = "block";
        loadAdminMovies();
    } else {
        alert("❌ Access Denied: Incorrect Passcode!");
    }
}

async function changePassword() {
    const newPass = document.getElementById("newPassInput").value.trim();
    if(newPass.length < 3) {
        alert("⚠️ Please enter a passcode with at least 3 characters!");
        return;
    }
    
    const newHash = await hashString(newPass);
    localStorage.setItem("BADGE_ADMIN_HASH", newHash);
    document.getElementById("newPassInput").value = "";
    alert("✅ Passcode Updated Successfully!");
}

function getDatabase() {
    return JSON.parse(localStorage.getItem("BADGE_MOVIES_DB")) || [];
}

function saveDatabase(data) {
    localStorage.setItem("BADGE_MOVIES_DB", JSON.stringify(data));
}

function addMovie(e) {
    e.preventDefault();
    const db = getDatabase();
    
    const newMovie = {
        id: Date.now(),
        name: document.getElementById("mName").value,
        rating: document.getElementById("mRating").value,
        banner: document.getElementById("mBanner").value,
        link: document.getElementById("mLink").value.trim(),
        trending: document.getElementById("mTrending").value
    };

    db.unshift(newMovie);
    saveDatabase(db);
    document.getElementById("movieForm").reset();
    loadAdminMovies();
    alert("✅ Movie Successfully Published!");
}

function deleteMovie(id) {
    if(confirm("Are you sure you want to remove this movie?")) {
        let db = getDatabase();
        db = db.filter(m => m.id !== id);
        saveDatabase(db);
        loadAdminMovies();
    }
}

function loadAdminMovies() {
    const db = getDatabase();
    const list = document.getElementById("adminMovieList");
    list.innerHTML = "";

    if(db.length === 0) {
        list.innerHTML = "<p style='color:#444; font-size:11px;'>No movies added yet.</p>";
        return;
    }

    db.forEach(m => {
        const isUpcoming = !m.link || m.link.trim() === "";
        list.innerHTML += `
            <div class="movie-item">
                <div class="movie-info">
                    <img src="${m.banner}" class="movie-poster" onerror="this.src='https://via.placeholder.com/45x60?text=No+Img'">
                    <div>
                        <strong style="font-size:13px">${m.name}</strong>
                        <div style="font-size:10px; color:#777; margin-top:3px;">
                            ⭐ ${m.rating} | ${isUpcoming ? '⏳ UPCOMING' : '⚡ READY'}
                        </div>
                    </div>
                </div>
                <button class="del-btn" onclick="deleteMovie(${m.id})">Delete</button>
            </div>
        `;
    });
}
</script>
</body>
              </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BADGE — Movies Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #040405; --card: #0d0d10; --red: #ff1744; --line: rgba(255,255,255,0.08); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body { background: var(--bg); color: #fff; min-height: 100vh; padding-bottom: 60px; }

header { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: rgba(4,4,5,0.8); backdrop-filter: blur(20px); position: sticky; top:0; z-index:100; }
.logo { font-family: 'Space Grotesk'; font-size: 24px; font-weight: 900; text-decoration:none; color:#fff; }
.logo span { color: var(--red); }
.back-btn { color: #888; text-decoration: none; font-size: 11px; font-weight: 800; letter-spacing:1px; transition:0.3s; }
.back-btn:hover { color: #fff; }

.container { width: min(1200px, 90%); margin: 40px auto; }
.title-area { display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
.title { font-family: 'Space Grotesk'; font-size: 36px; }

.controls-bar { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 250px; padding: 12px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 30px; color: #fff; font-size: 12px; outline: none; }
.search-input:focus { border-color: var(--red); }

.filter-btn { padding: 10px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 30px; color: #aaa; font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; }
.filter-btn.active, .filter-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }

.movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.movie-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: 0.3s; position: relative; }
.movie-card:hover { border-color: rgba(255,23,68,0.4); transform: translateY(-5px); }
.poster-wrapper { width: 100%; height: 310px; position: relative; overflow: hidden; background:#111; }
.poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }

.badge-trend { position: absolute; top: 10px; left: 10px; background: var(--red); color: #fff; font-size: 8px; font-weight: 900; padding: 4px 8px; border-radius: 20px; text-transform: uppercase; }
.badge-rating { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); color: #ffd43b; font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }

.card-details { padding: 15px; }
.movie-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.download-btn { display: block; width: 100%; text-align: center; background: var(--red); color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 900; letter-spacing: 1px; transition: 0.2s; }
.download-btn.upcoming { background: #222; color: #ffd43b; border: 1px solid rgba(255,212,59,0.3); }
.download-btn:hover { opacity: 0.9; }

.empty-msg { text-align:center; padding:60px 0; color:#555; font-size:12px; width:100%; grid-column:1 / -1; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">BADGE<span>.</span></a>
    <a href="index.html" class="back-btn">← BACK TO HOME</a>
</header>

<div class="container">
    <div class="title-area">
        <h1 class="title">MOVIES HUB</h1>
    </div>

    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies by name..." oninput="filterMovies()">
        <button class="filter-btn active" onclick="setFilter('ALL', this)">ALL</button>
        <button class="filter-btn" onclick="setFilter('TRENDING', this)">🔥 TRENDING</button>
        <button class="filter-btn" onclick="setFilter('UPCOMING', this)">⏳ UPCOMING</button>
    </div>

    <div class="movie-grid" id="movieGrid"></div>
</div>

<script>
let currentFilter = 'ALL';

function setFilter(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = type;
    filterMovies();
}

function filterMovies() {
    const db = JSON.parse(localStorage.getItem("BADGE_MOVIES_DB")) || [];
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    
    const filtered = db.filter(m => {
        const matchesQuery = m.name.toLowerCase().includes(query);
        const isUpcoming = !m.link || m.link.trim() === "";
        
        if(currentFilter === 'TRENDING') return matchesQuery && m.trending === 'YES';
        if(currentFilter === 'UPCOMING') return matchesQuery && isUpcoming;
        return matchesQuery;
    });

    renderGrid(filtered);
}

function renderGrid(movies) {
    const grid = document.getElementById("movieGrid");
    grid.innerHTML = "";

    if(movies.length === 0) {
        grid.innerHTML = `<div class="empty-msg">No movies found matching criteria.</div>`;
        return;
    }

    movies.forEach(m => {
        const isUpcoming = !m.link || m.link.trim() === "";
        const actionBtn = isUpcoming 
            ? `<a href="exp.html?id=${m.id}" class="download-btn upcoming">UPCOMING ⏳</a>`
            : `<a href="${m.link}" target="_blank" class="download-btn">DOWNLOAD NOW ⚡</a>`;

        grid.innerHTML += `
            <div class="movie-card">
                <div class="poster-wrapper">
                    ${m.trending === 'YES' ? '<div class="badge-trend">🔥 TRENDING</div>' : ''}
                    <div class="badge-rating">⭐ ${m.rating}</div>
                    <img src="${m.banner}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Poster'">
                </div>
                <div class="card-details">
                    <div class="movie-title">${m.name}</div>
                    ${actionBtn}
                </div>
            </div>
        `;
    });
}

filterMovies();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">BADGE — Watch & Download Live Movies</title>

<script type="text/javascript" src="https://pl31047404.profitableratecpmnetwork.com/09/9e/c1/099ec1cc901a6079dcff36013a287512.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --card: #0d0d11; --red: #ff1744; --line: rgba(255,255,255,0.08); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body { background: var(--bg); color: #fff; min-height: 100vh; padding: 20px 15px; }

.container { max-width: 1200px; margin: 0 auto; }

header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; color: var(--red); display: flex; align-items: center; gap: 10px; }
.movie-count-badge { background: rgba(255,23,68,0.15); color: var(--red); font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,23,68,0.3); font-family: 'Inter', sans-serif; }

/* Control Panel: Search & Filter Tabs */
.controls-bar { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
@media(min-width: 768px) {
    .controls-bar { flex-direction: row; justify-content: space-between; align-items: center; }
}

.search-box { position: relative; width: 100%; max-width: 400px; }
.search-box input { width: 100%; padding: 12px 18px 12px 42px; background: var(--card); border: 1px solid var(--line); border-radius: 30px; color: #fff; font-size: 13px; outline: none; transition: 0.3s; }
.search-box input:focus { border-color: var(--red); box-shadow: 0 0 15px rgba(255,23,68,0.2); }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666; font-size: 14px; }

.filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
.tab-btn { background: var(--card); border: 1px solid var(--line); color: #888; padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.3s; white-space: nowrap; text-transform: uppercase; }
.tab-btn.active, .tab-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }

/* Movie Grid System */
.movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: 0.3s; position: relative; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-6px); border-color: var(--red); box-shadow: 0 10px 25px rgba(255,23,68,0.15); }
.poster-wrapper { position: relative; width: 100%; height: 240px; background: #111; overflow: hidden; }
.poster { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
.card:hover .poster { transform: scale(1.05); }

.badge-trend { position: absolute; top: 10px; right: 10px; background: var(--red); color: #fff; font-size: 8px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.rating-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }

.info { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
.title { font-size: 13px; font-weight: 800; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.status-text { font-size: 10px; font-weight: 700; color: #777; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }

.btn-dl { display: block; width: 100%; text-align: center; background: #fff; color: #000; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; cursor: pointer; }
.btn-dl:hover { background: var(--red); color: #fff; }
.btn-dl.upcoming { background: #181820; color: #555; pointer-events: none; border: 1px solid var(--line); }

.no-results { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #555; font-size: 13px; }

/* Dynamic Small Top Pop-up Notification Banner UI */
.popup-overlay {
    position: fixed;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 380px;
    z-index: 9999;
    transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.popup-overlay.show {
    top: 15px;
}
.popup-box {
    background: #0d0d11;
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 25px rgba(255, 23, 68, 0.35);
    position: relative;
    overflow: hidden;
}
.popup-close {
    position: absolute;
    top: 4px; right: 6px;
    background: transparent;
    color: #888;
    border: none;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
}
.popup-close:hover { color: #fff; }

.popup-img-wrapper {
    width: 60px;
    height: 60px;
    min-width: 60px;
    border-radius: 8px;
    overflow: hidden;
    background: #111;
    border: 1px solid rgba(255,255,255,0.1);
}
.popup-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.popup-actions { 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center;
    gap: 6px;
    padding-right: 15px;
}
.popup-title-text {
    font-size: 11px;
    font-weight: 700;
    color: #eee;
    line-height: 1.2;
}
.btn-help-now {
    display: inline-block;
    text-align: center;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.5px;
    transition: 0.2s;
}
.btn-help-now:hover { background: #d50000; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>
            <span id="headerTitle">BADGE MOVIES</span>
            <span class="movie-count-badge" id="totalCount">0 MOVIES</span>
        </h1>
        <a href="admin.html" style="color:#666; font-size:11px; text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:20px;">Admin Access ↗</a>
    </header>

    <div class="controls-bar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search movies by title...">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="ALL" id="tabAll">All Movies</button>
            <button class="tab-btn" data-filter="TRENDING" id="tabTrending">🔥 Trending</button>
            <button class="tab-btn" data-filter="READY" id="tabReleased">⚡ Released</button>
            <button class="tab-btn" data-filter="UPCOMING" id="tabUpcoming">⏳ Upcoming</button>
        </div>
    </div>

    <div class="movie-grid" id="publicMovieList">
        <div class="no-results">Connecting to cloud database...</div>
    </div>
</div>

<div id="nepalPopupOverlay" class="popup-overlay">
    <div class="popup-box">
        <button class="popup-close" id="closeNepalPopup">&times;</button>
        <div class="popup-img-wrapper">
            <img id="nepalPopupImg" src="" alt="Nepal Support">
        </div>
        <div class="popup-actions">
            <span class="popup-title-text" id="popupBannerText">Support Nepal Relief Campaign 🇳🇵</span>
            <a href="nepal.html" class="btn-help-now" id="popupBannerBtnText">HELP NOW ↗</a>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBfGylU2R4GTtsgqJsbDl-Y2e8i-a2jbEE",
    authDomain: "badger-e5c9f.firebaseapp.com",
    databaseURL: "https://badger-e5c9f-default-rtdb.firebaseio.com",
    projectId: "badger-e5c9f",
    storageBucket: "badger-e5c9f.firebasestorage.app",
    messagingSenderId: "483650469817",
    appId: "1:483650469817:web:5818b00d1732b8baee8068",
    measurementId: "G-EXEE25B743"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let AD_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/v9t4iwye?key=d378794adebb734d009f4350373582eb";

  let allMoviesData = [];
  let currentFilter = "ALL";
  let searchQuery = "";
  let activeBannerUrl = "";
  let popupInterval = null;
  let hideTimeout = null;

  // --- 0. DYNAMIC EDITABLE FIELDS LISTENER ---
  const customFieldsRef = ref(db, 'editable_fields');
  onValue(customFieldsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.site_title?.value) {
          document.getElementById("headerTitle").textContent = data.site_title.value;
          document.getElementById("docTitle").textContent = data.site_title.value;
      }
      if (data.ad_link?.value) {
          AD_DIRECT_LINK = data.ad_link.value;
      }
      if (data.popup_text?.value) {
          document.getElementById("popupBannerText").textContent = data.popup_text.value;
      }
      if (data.popup_btn_text?.value) {
          document.getElementById("popupBannerBtnText").textContent = data.popup_btn_text.value;
      }
      if (data.tab_all?.value) document.getElementById("tabAll").textContent = data.tab_all.value;
      if (data.tab_trending?.value) document.getElementById("tabTrending").textContent = data.tab_trending.value;
      if (data.tab_released?.value) document.getElementById("tabReleased").textContent = data.tab_released.value;
      if (data.tab_upcoming?.value) document.getElementById("tabUpcoming").textContent = data.tab_upcoming.value;
  });

  // 1. Firebase Reference for Movies
  const moviesRef = ref(db, 'movies');
  onValue(moviesRef, (snapshot) => {
      const data = snapshot.val();
      allMoviesData = [];

      if (data) {
          Object.keys(data).reverse().forEach(key => {
              allMoviesData.push({ id: key, ...data[key] });
          });
      }

      document.getElementById("totalCount").textContent = `${allMoviesData.length} MOVIES`;
      renderMovies();
  });

  // 2. Dynamic 25 Sec Cycle Pop-up Handler
  const nepalPopupRef = ref(db, 'nepal_popup_banner');
  onValue(nepalPopupRef, (snapshot) => {
      activeBannerUrl = snapshot.val();
      const popupImg = document.getElementById("nepalPopupImg");

      if (activeBannerUrl && activeBannerUrl.trim() !== "") {
          popupImg.src = activeBannerUrl;
          startPopupLoop();
      } else {
          stopPopupLoop();
      }
  });

  function showPopupTemporarily() {
      const popupOverlay = document.getElementById("nepalPopupOverlay");
      if (!activeBannerUrl) return;

      popupOverlay.classList.add("show");

      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
          popupOverlay.classList.remove("show");
      }, 5000);
  }

  function startPopupLoop() {
      stopPopupLoop();
      setTimeout(() => {
          showPopupTemporarily();
      }, 1000);

      popupInterval = setInterval(() => {
          showPopupTemporarily();
      }, 25000);
  }

  function stopPopupLoop() {
      const popupOverlay = document.getElementById("nepalPopupOverlay");
      popupOverlay.classList.remove("show");
      if (popupInterval) clearInterval(popupInterval);
      if (hideTimeout) clearTimeout(hideTimeout);
  }

  document.getElementById("closeNepalPopup").addEventListener("click", () => {
      document.getElementById("nepalPopupOverlay").classList.remove("show");
      if (hideTimeout) clearTimeout(hideTimeout);
  });

  function renderMovies() {
      const listContainer = document.getElementById("publicMovieList");
      listContainer.innerHTML = "";

      const filtered = allMoviesData.filter(m => {
          const isUpcoming = !m.link || m.link.trim() === "";
          
          let matchesFilter = true;
          if (currentFilter === "TRENDING") matchesFilter = m.trending === "YES";
          if (currentFilter === "READY") matchesFilter = !isUpcoming;
          if (currentFilter === "UPCOMING") matchesFilter = isUpcoming;

          const matchesSearch = m.name.toLowerCase().includes(searchQuery.toLowerCase());

          return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="no-results">❌ No movies found matching your search.</div>`;
          return;
      }

      filtered.forEach(m => {
          const isUpcoming = !m.link || m.link.trim() === "";
          const card = document.createElement("div");
          card.className = "card";
          
          card.innerHTML = `
              <div class="poster-wrapper">
                  ${m.trending === 'YES' ? '<div class="badge-trend">🔥 TRENDING</div>' : ''}
                  <img src="${m.banner}" class="poster" onerror="this.src='https://dummyimage.com/180x240/151518/888888.png&text=No+Poster'">
                  <div class="rating-tag">⭐ ${m.rating}</div>
              </div>
              <div class="info">
                  <div class="title"></div>
                  <div class="status-text">
                      ${isUpcoming ? '⏳ UPCOMING DROP' : '⚡ READY TO WATCH'}
                  </div>
                  ${isUpcoming 
                      ? '<a href="#" class="btn-dl upcoming">COMING SOON</a>' 
                      : `<a href="${AD_DIRECT_LINK}" target="_blank" data-real-link="${m.link}" class="btn-dl download-trigger">DOWNLOAD / WATCH</a>`}
              </div>
          `;

          card.querySelector(".title").textContent = m.name;
          listContainer.appendChild(card);
      });

      document.querySelectorAll(".download-trigger").forEach(btn => {
          btn.addEventListener("click", function(e) {
              const realLink = this.getAttribute("data-real-link");
              setTimeout(() => {
                  window.location.href = realLink;
              }, 100);
          });
      });
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderMovies();
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          renderMovies();
      });
  });
</script>
</body>
</html>
